<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harry Rogers | Interactive Terminal CV & Portfolio</title>
    <link rel="stylesheet" href="/terminal/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body class="crt-enabled" data-theme="default">

    <div class="scanline-overlay" id="scanline-overlay"></div>

    <main class="terminal-container">
        <div class="terminal-window">
            
            <!-- Window Control Header -->
            <header class="terminal-topbar">
                <div class="window-buttons">
                    <span class="btn-dot btn-close" id="btn-clear-term" title="Clear Terminal (Ctrl+L)"></span>
                    <span class="btn-dot btn-minimize" id="btn-reset-term" title="Reset View"></span>
                    <span class="btn-dot btn-toggle-crt" id="btn-toggle-crt" title="Toggle CRT Effects"></span>
                </div>
                <div class="window-title">
                    <span class="title-icon">&#9889;</span>
                    <span class="title-text">guest@harryrogers: ~ (vaidar-zsh)</span>
                </div>
                <div class="window-actions">
                    <button class="topbar-chip" id="theme-indicator" onclick="executeCommand('theme')">&#127912; Theme: Default</button>
                    <span class="status-badge"><span class="pulse-dot"></span> ONLINE</span>
                </div>
            </header>

            <!-- Terminal Output & Body -->
            <div class="terminal-body" id="terminal-body">
                
                <!-- Output Stream Container -->
                <div id="terminal-output" role="log" aria-live="polite">
                    <!-- Banner Output rendered dynamically on load -->
                </div>

                <!-- Active Command Input Line -->
                <div class="terminal-input-row" id="terminal-input-row">
                    <span class="prompt-string">
                        <span class="prompt-user">guest</span><span class="prompt-at">@</span><span class="prompt-host">harryrogers</span>:<span class="prompt-path">~</span><span class="prompt-symbol">$</span>
                    </span>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="command-input" 
                            autocomplete="off" 
                            autocorrect="off" 
                            autocapitalize="off" 
                            spellcheck="false" 
                            autofocus 
                            aria-label="Terminal Command Input" 
                            placeholder="Type 'help' to see available commands..."
                        />
                    </div>
                </div>

            </div>

            <!-- Terminal Footer / Quick Actions -->
            <footer class="terminal-footer">
                <span class="footer-hint">Hints: Tab completion â€¢ Up/Down history â€¢ Ctrl+L clear â€¢ Click anywhere to focus</span>
                <span class="footer-credits">VAIDAR Engine v2.6</span>
            </footer>

        </div>
    </main>

    <script src="/terminal/js/cv-data.js"></script>
    <script src="/terminal/js/terminal.js"></script>
</body>
</html>
