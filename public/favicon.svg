<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 216" width="216" height="216">
  <style>
    .light-logo { display: block; }
    .dark-logo { display: none; }
    @media (prefers-color-scheme: dark) {
      .light-logo { display: none; }
      .dark-logo { display: block; }
    }
  </style>
  <image class="light-logo" href="data:image/png;base64," width="216" height="216" />
  <image class="dark-logo" href="data:image/png;base64," width="216" height="216" />
</svg>
