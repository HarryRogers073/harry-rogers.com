<svg xmlns="http://www.w3.org/2000/svg" width="91mm" height="61mm" viewBox="0 0 1075 720" style="background:#090e15; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1622"/>
      <stop offset="60%" stop-color="#0b1019"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1075" height="720" fill="url(#bgGrad2)"/>

  <!-- Top Header Bar -->
