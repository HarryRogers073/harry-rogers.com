    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Windows 7 Style Desktop Background */
            background: radial-gradient(circle at center 20%, #4bc1ef 0%, #0d6ab7 60%, #044280 100%);
            background-size: cover;
            color: #cccccc;
            font-family: 'Fira Code', 'Consolas', 'Courier New', Courier, monospace;
            font-size: 16px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 5vh;
            overflow: hidden;
        }

        #terminal-container {
            width: 92vw;
            max-width: 1600px;
            aspect-ratio: 16 / 9;
            height: auto;
            max-height: 88vh;
            background-color: #0c0c0c;
            border-radius: 8px;
            border: 6px solid rgba(255, 255, 255, 0.4); /* Aero glass border effect */
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            background-clip: padding-box;
        }

        #title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, #f9f9f9, #e0e4eb 50%, #c3cbe0 51%, #d0d6e8);
            color: #000;
            padding: 4px 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 12px;
            border-bottom: 1px solid #333;
            margin: -20px -20px 20px -20px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
        }

        #title-bar-text {
            font-weight: 500;
            text-shadow: 0 1px 0 rgba(255,255,255,0.8);
        }

        #window-controls {
            display: flex;
            gap: 2px;
        }

        .control {
            display: inline-block;
            width: 24px;
            height: 18px;
            text-align: center;
            line-height: 16px;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: 2px;
            color: #333;
            font-family: 'Segoe UI Symbol', sans-serif;
            font-size: 10px;
        }

        .control:hover {
            background: rgba(255,255,255,0.8);
            border: 1px solid #aaa;
        }

        .control.close:hover {
            background: #e81123;
            color: white;
            border-color: #e81123;
        }

        #terminal-output {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .terminal-line {
            margin-bottom: 8px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .terminal-line.command {
            color: #82aaff;
            font-weight: bold;
            margin-top: 10px;
        }

        .terminal-line.output {
            color: #c3e88d;
        }

        .terminal-line.error {
            color: #f07178;
        }

        .terminal-line.info {
            color: #89ddff;
        }
        
        .terminal-line.highlight {
            color: #ffcb6b;
        }

        #input-line {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }

        #prompt {
            color: #82aaff;
            font-weight: bold;
            margin-right: 10px;
            white-space: nowrap;
        }

        #terminal-input {
            background: transparent;
            border: none;
            color: #a6accd;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 16px;
            flex-grow: 1;
            outline: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1c23; 
        }
         
        ::-webkit-scrollbar-thumb {
            background: #3b3f51; 
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4e5569; 
        }
    </style>

        const terminalInput = document.getElementById('terminal-input');
        const terminalOutput = document.getElementById('terminal-output');

        function printToTerminal(text, type = 'output') {
            if (text === '') return;
            const line = document.createElement('div');
            line.className = `terminal-line ${type}`;
            line.innerHTML = text;
            terminalOutput.appendChild(line);
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        terminalInput.addEventListener('keydown', async function(event) {
            if (event.key === 'Enter') {
                const input = terminalInput.value.trim();
                terminalInput.value = '';

                if (input) {
                    printToTerminal(`C:\\Users\\Harry> ${input}`, 'command');
                    
                    const parts = input.split(' ');
                    const cmd = parts[0].toLowerCase();
                    const args = parts.slice(1).join(' ');

                    if (commands[cmd]) {
                        // Support async commands
                        const output = await commands[cmd].execute(args);
                        if (output !== undefined && output !== '') {
                            printToTerminal(output, 'output');
                        }
                    } else {
                        printToTerminal(`Command not found: ${cmd}. Type 'help' for a list of available commands.`, 'error');
                    }
                }
            }
        });

        // Ensure input stays focused when clicking anywhere in the terminal
        document.getElementById('terminal-container').addEventListener('click', () => {

        async function typeString(str, type, speed = 15) {
            const line = document.createElement('div');
            line.className = `terminal-line ${type}`;
            terminalOutput.appendChild(line);
